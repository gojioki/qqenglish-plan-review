  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

          &lt;div class=&quot;qqe-card-topline&quot;&gt;&lt;span class=&quot;qqe-card-category&quot;&gt;KIDS CAMP&lt;/span&gt;&lt;span class=&quot;qqe-label&quot;&gt;期間限定&lt;/span&gt;&lt;/div&gt;
          &lt;h3&gt;キッズキャンプ&lt;/h3&gt;
          &lt;p&gt;英語レッスンとアクティビティを通して、2週間の英語漬け生活を体験。対象年齢・開催日程は募集回によって異なります。&lt;/p&gt;
        &lt;/div&gt;

      &lt;/article&gt;
    &lt;/section&gt;

    &lt;section class=&quot;qqe-level-guide&quot; aria-labelledby=&quot;qqe-level-guide-heading&quot;&gt;
      &lt;div&gt;
        &lt;h2 id=&quot;qqe-level-guide-heading&quot;&gt;受講前の英語レベルについて&lt;/h2&gt;
        &lt;p&gt;当校では、ご渡航前にレベルテストを受講していただき、その結果をもとに、受講者に適したカリキュラムを自動で予約していきます。&lt;/p&gt;
      &lt;/div&gt;
      &lt;button class=&quot;qqe-level-link&quot; type=&quot;button&quot;&gt;英語レベル表を見る　›&lt;/button&gt;
    &lt;/section&gt;

    &lt;section class=&quot;qqe-info-section&quot; aria-labelledby=&quot;qqe-cost-heading&quot;&gt;
      &lt;div class=&quot;qqe-info-heading&quot;&gt;
        &lt;h2 id=&quot;qqe-cost-heading&quot;&gt;上記以外に必要な費用&lt;/h2&gt;
      &lt;/div&gt;
      &lt;div class=&quot;qqe-cost-grid&quot;&gt;
        &lt;section class=&quot;qqe-cost-group&quot;&gt;
          &lt;h3&gt;全員必要な費用&lt;/h3&gt;
          &lt;ul class=&quot;qqe-cost-list&quot;&gt;
            &lt;li&gt;入学金 $150&lt;/li&gt;
            &lt;li&gt;海外送金手数料 $30&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/section&gt;

        &lt;section class=&quot;qqe-cost-group&quot;&gt;
          &lt;h3&gt;フィリピンの祝日に授業がある場合の追加料金&lt;/h3&gt;
          &lt;ul class=&quot;qqe-cost-list&quot;&gt;
            &lt;li&gt;祝日開講手数料 $35&lt;/li&gt;
          &lt;/ul&gt;
          &lt;div class=&quot;qqe-cost-actions&quot;&gt;
            &lt;button class=&quot;qqe-inline-link&quot; type=&quot;button&quot;&gt;フィリピン祝日一覧　›&lt;/button&gt;
          &lt;/div&gt;
        &lt;/section&gt;

        &lt;section class=&quot;qqe-cost-group qqe-cost-group--local&quot;&gt;
          &lt;h3&gt;セブ現地でのお支払い（ペソ：PHP）&lt;/h3&gt;
          &lt;div class=&quot;qqe-local-layout&quot;&gt;
            &lt;div&gt;
              &lt;ul class=&quot;qqe-cost-list&quot;&gt;
                &lt;li&gt;SSP代 10,440 PHP(※1)&lt;/li&gt;
                &lt;li&gt;VISA代 下記一覧参照&lt;/li&gt;
                &lt;li&gt;ACR-Iカード代（60日以上の滞在の場合） 3,200 PHP(※2)&lt;/li&gt;
                &lt;li&gt;ID代 300 PHP&lt;/li&gt;
                &lt;li&gt;教材費 1,000～2,000 PHP(※3)&lt;/li&gt;
                &lt;li&gt;電気代（1日あたり） 100 PHP(※4)&lt;/li&gt;
              &lt;/ul&gt;
              &lt;div class=&quot;qqe-cost-notes&quot;&gt;
                &lt;p&gt;※1 SSP（Special Study Permit）：フィリピン政府が発行する「特別就学許可証」のことです。&lt;/p&gt;
                &lt;p&gt;※2 I-Card（Alien Certificate of Registration Identity Card）：フィリピン政府(移民局)が外国人のフィリピン居住者を把握するために、60日以上国内に滞在する外国人に発行を義務付けているものです。&lt;/p&gt;
                &lt;p&gt;※3 生徒様のご希望または受講カリキュラムによります。&lt;/p&gt;
                &lt;p&gt;※4 学生寮(カプセルホテル)利用者のみ。&lt;/p&gt;
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;details class=&quot;qqe-disclosure&quot; open&gt;
              &lt;summary&gt;VISA代 一覧&lt;/summary&gt;
              &lt;div class=&quot;qqe-disclosure-body&quot;&gt;
                &lt;ul class=&quot;qqe-visa-list&quot;&gt;
                  &lt;li&gt;30日以内：無料&lt;/li&gt;
                  &lt;li&gt;31日～59日：4,460 PHP&lt;/li&gt;
                  &lt;li&gt;60日～90日：10,945 PHP&lt;/li&gt;
                  &lt;li&gt;91日～120日：14,715 PHP&lt;/li&gt;
                  &lt;li&gt;121日～150日：18,485 PHP&lt;/li&gt;
                  &lt;li&gt;151日～180日：22,255 PHP&lt;/li&gt;
                &lt;/ul&gt;
              &lt;/div&gt;
            &lt;/details&gt;
          &lt;/div&gt;
        &lt;/section&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;qqe-info-section&quot; aria-labelledby=&quot;qqe-plan-heading&quot;&gt;
      &lt;div class=&quot;qqe-info-heading&quot;&gt;
        &lt;h2 id=&quot;qqe-plan-heading&quot;&gt;当校のプランの詳細&lt;/h2&gt;
      &lt;/div&gt;

      &lt;div class=&quot;qqe-plan-basics&quot;&gt;
        &lt;section class=&quot;qqe-plan-basic&quot;&gt;
          &lt;h3&gt;予約可能時間&lt;/h3&gt;
          &lt;p&gt;当週の月曜日0:00～（レッスンは自動で予約されます）&lt;/p&gt;
          &lt;p&gt;例：2026年1月9日のレッスンは2026年1月5日の0:00より予約可能となります。&lt;/p&gt;
        &lt;/section&gt;
        &lt;section class=&quot;qqe-plan-basic&quot;&gt;
          &lt;h3&gt;レッスン提供時間&lt;/h3&gt;
          &lt;p&gt;9時～18時（フィリピン時間）&lt;/p&gt;
        &lt;/section&gt;
      &lt;/div&gt;

      &lt;div class=&quot;qqe-rule-list&quot;&gt;
        &lt;details class=&quot;qqe-disclosure&quot;&gt;
          &lt;summary&gt;予約方法・ルール&lt;/summary&gt;
          &lt;div class=&quot;qqe-disclosure-body&quot;&gt;
            &lt;p class=&quot;qqe-benefit-callout&quot;&gt;&lt;span class=&quot;qqe-benefit-label&quot;&gt;メリット&lt;/span&gt;12時間以上前にキャンセルすれば、返還されたポイントで別の日時に予約を取り直せます。&lt;/p&gt;
            &lt;p&gt;留学開始時に留学期間中に使用いただけるポイントが付与されます。 お持ちのポイントを使用してレッスンをご予約いただけます。（提供時間内に限る）&lt;/p&gt;
            &lt;p&gt;なお、レッスン予約はすべてQQEnglishにて行われます。 こちらはキャンセルすることでポイントが返却されますので、予約を取り直すことも可能です。&lt;/p&gt;
            &lt;p&gt;※キャンセル時にはキャンセルポリシーが適用されます。ご注意ください。&lt;/p&gt;
          &lt;/div&gt;
        &lt;/details&gt;

        &lt;details class=&quot;qqe-disclosure&quot;&gt;
          &lt;summary&gt;ポイントの有効期限&lt;/summary&gt;
          &lt;div class=&quot;qqe-disclosure-body&quot;&gt;
            &lt;p&gt;30日間を超えるご留学の場合、ポイントには有効期限が設定されます。&lt;/p&gt;
            &lt;p&gt;プランによってポイントの最低利用数は異なります。詳細は留学アカウントよりご確認いただけます。&lt;/p&gt;
          &lt;/div&gt;
        &lt;/details&gt;

        &lt;details class=&quot;qqe-disclosure&quot;&gt;
          &lt;summary&gt;教師の選択&lt;/summary&gt;
          &lt;div class=&quot;qqe-disclosure-body&quot;&gt;
            &lt;p class=&quot;qqe-benefit-callout&quot;&gt;&lt;span class=&quot;qqe-benefit-label&quot;&gt;メリット&lt;/span&gt;教師は空き状況に応じて選択・変更でき、気に入った教師を続けて予約することもできます。&lt;/p&gt;
            &lt;p&gt;QQEnglishでは、教師によってレッスンポイントが異なります。&lt;/p&gt;
            &lt;p&gt;40ポイント～150ポイントまでの教師が設定されており、ほとんどの教師は50ポイントで設定されております。&lt;/p&gt;
            &lt;p&gt;ポイントは受講者からの評価や予約率に応じて設定されており、高ポイントの教師ほど高いスキルを持ち、人気があります。&lt;/p&gt;
            &lt;p&gt;※表示されるポイントは25分間のレッスンに必要なもののため、留学のレッスン（50分）では表示されるポイントの2倍のポイント数を使用いただきます。&lt;/p&gt;
          &lt;/div&gt;
        &lt;/details&gt;

        &lt;details class=&quot;qqe-disclosure&quot;&gt;
          &lt;summary&gt;ポイント加算カリキュラム&lt;/summary&gt;
          &lt;div class=&quot;qqe-disclosure-body&quot;&gt;
            &lt;p&gt;ポイント加算カリキュラムとは、教師ポイントとは別に、カリキュラムに対してポイントが加算されるカリキュラムです。&lt;/p&gt;
            &lt;p&gt;加算されるポイントは一律で、25分間あたり、25ポイントとなります。&lt;/p&gt;
            &lt;p&gt;例：50ポイント教師の「Global Business Skills（50分）」をご予約頂く場合のレッスンポイント 教師ポイント（100ポイント）＋カリキュラムの加算ポイント（50ポイント）＝150ポイントが必要となります。&lt;/p&gt;
            &lt;p&gt;ポイント加算カリキュラムには、次のものがあります。&lt;/p&gt;
            &lt;ul&gt;
              &lt;li&gt;TOEIC対策&lt;/li&gt;
              &lt;li&gt;Global Business Skills&lt;/li&gt;
              &lt;li&gt;Business English&lt;/li&gt;
              &lt;li&gt;カラン for キッズ&lt;/li&gt;
              &lt;li&gt;英検®面接対策・パス単（準1級〜5級）&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/div&gt;
        &lt;/details&gt;

        &lt;details class=&quot;qqe-disclosure&quot;&gt;
          &lt;summary&gt;キャンセルポリシー（生徒様）&lt;/summary&gt;
          &lt;div class=&quot;qqe-disclosure-body&quot;&gt;
            &lt;p class=&quot;qqe-benefit-callout&quot;&gt;&lt;span class=&quot;qqe-benefit-label&quot;&gt;メリット&lt;/span&gt;体調不良などの場合も、12時間以上前にキャンセルすればポイントが返還され、別の日時に予約できます。&lt;/p&gt;
            &lt;p&gt;レッスン開始時間から&lt;/p&gt;
            &lt;ul&gt;
              &lt;li&gt;12時間以上前のキャンセル ：レッスンポイントを返還&lt;/li&gt;
              &lt;li&gt;12時間〜1時間前のキャンセル ：レッスンポイントの50％を返還&lt;/li&gt;
              &lt;li&gt;1時間を切ってのキャンセル：レッスンポイントを喪失&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/div&gt;
        &lt;/details&gt;

        &lt;details class=&quot;qqe-disclosure&quot;&gt;
          &lt;summary&gt;教師都合のキャンセル時のポイント返還&lt;/summary&gt;
          &lt;div class=&quot;qqe-disclosure-body&quot;&gt;
            &lt;p class=&quot;qqe-benefit-callout&quot;&gt;&lt;span class=&quot;qqe-benefit-label&quot;&gt;ポイント返還&lt;/span&gt;教師側の都合でキャンセルされた場合はポイントが返還され、直前のキャンセルでは追加ポイントも付与されます。&lt;/p&gt;
            &lt;p&gt;レッスン開始時間から&lt;/p&gt;
            &lt;ul&gt;
              &lt;li&gt;12時間以上前のキャンセル ：レッスンポイントを返還&lt;/li&gt;
              &lt;li&gt;12時間〜1時間前のキャンセル ：レッスンポイントの150％を返還&lt;/li&gt;
              &lt;li&gt;1時間を切ってのキャンセル ：レッスンポイントの200％を返還&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/div&gt;
        &lt;/details&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;qqe-support&quot; aria-labelledby=&quot;qqe-support-heading&quot;&gt;
      &lt;div&gt;
        &lt;h2 id=&quot;qqe-support-heading&quot;&gt;どのコースが合うか分からない方へ&lt;/h2&gt;

  &lt;footer class=&quot;qqe-footer&quot;&gt;※料金・期間はモックアップ用の参考表示です。公開時に最新情報をご確認ください。&lt;/footer&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;qqe-course-a-refined&#x27;);
      const tabs = [...root.querySelectorAll(&#x27;.qqe-purpose-tabs button&#x27;)];
      const items = [...root.querySelectorAll(&#x27;.qqe-course-item&#x27;)];
      const seasonal = root.querySelector(&#x27;[data-seasonal-section]&#x27;);
      const resultCount = root.querySelector(&#x27;[data-result-count]&#x27;);

      const updateResultCount = () =&gt; {
        const visibleCourses = items.filter((item) =&gt; !item.classList.contains(&#x27;qqe-hidden&#x27;)).length;
        const seasonalCount = seasonal.classList.contains(&#x27;qqe-hidden&#x27;) ? 0 : 1;
        resultCount.textContent = String(visibleCourses + seasonalCount);
      };

      tabs.forEach((tab) =&gt; {
        tab.addEventListener(&#x27;click&#x27;, () =&gt; {
          const filter = tab.dataset.filter;
          tabs.forEach((candidate) =&gt; candidate.setAttribute(&#x27;aria-pressed&#x27;, String(candidate === tab)));
          items.forEach((item) =&gt; {
            item.classList.toggle(&#x27;qqe-hidden&#x27;, filter !== &#x27;all&#x27; &amp;&amp; item.dataset.category !== filter);
          });
          seasonal.classList.toggle(&#x27;qqe-hidden&#x27;, filter !== &#x27;all&#x27; &amp;&amp; filter !== &#x27;family&#x27;);
          updateResultCount();
        });
      });

      root.querySelectorAll(&#x27;a[href=&quot;#&quot;]&#x27;).forEach((link) =&gt; link.addEventListener(&#x27;click&#x27;, (event) =&gt; event.preventDefault()));
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
