<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>QQEnglish 料金プランページ案｜比較レビュー</title>
  <style>
    :root {
      color: #17324d;
      background: #f3f7fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header {
      padding: 22px clamp(18px, 4vw, 56px) 16px;
      background: #fff;
      border-bottom: 1px solid #dbe5ee;
    }
    .eyebrow { margin: 0 0 5px; color: #0a6ecb; font-size: 12px; font-weight: 800; letter-spacing: .08em; }
    h1 { margin: 0; font-size: clamp(20px, 3vw, 30px); }
    .lead { margin: 7px 0 0; color: #587087; font-size: 14px; }
    main { padding: 16px clamp(12px, 3vw, 40px) 30px; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .tabs, .viewports { display: flex; gap: 8px; flex-wrap: wrap; }
    button, .open-link {
      appearance: none;
      border: 1px solid #c9d7e4;
      border-radius: 999px;
      background: #fff;
      color: #24425f;
      padding: 9px 15px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    button:hover, .open-link:hover { border-color: #0a6ecb; }
    button.active { background: #0a6ecb; border-color: #0a6ecb; color: #fff; }
    .summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      min-height: 68px;
      padding: 12px 16px;
      margin-bottom: 12px;
      border: 1px solid #dbe5ee;
      border-radius: 12px;
      background: #fff;
    }
    .summary strong { display: block; margin-bottom: 3px; }
    .summary p { margin: 0; color: #587087; font-size: 13px; line-height: 1.55; }
    .stage {
      min-height: 720px;
      padding: 12px;
      overflow: auto;
      border: 1px solid #d3dfe9;
      border-radius: 14px;
      background: #dfe8f0;
    }
    iframe {
      display: block;
      width: 100%;
      min-width: 320px;
      height: 780px;
      margin: 0 auto;
      border: 0;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(26, 55, 81, .14);
      transition: width .2s ease;
    }
    iframe.mobile { width: 390px; }
    .notice { margin: 12px 2px 0; color: #6c7e90; font-size: 12px; }
    @media (max-width: 640px) {
      .summary { grid-template-columns: 1fr; }
      .open-link { justify-self: start; }
      .viewports { display: none; }
      .stage { padding: 0; border-radius: 8px; }
      iframe { height: 720px; border-radius: 8px; }
    }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">INTERNAL REVIEW MOCKUP</p>
    <h1>QQEnglish 料金プランページ案</h1>
    <p class="lead">A・B・Cのタブを切り替えて、構成と導線を比較できます。</p>
  </header>
  <main>
    <div class="toolbar">
      <nav class="tabs" aria-label="モックアップ案">
        <button type="button" class="active" data-plan="a">A案</button>
        <button type="button" data-plan="b">B案</button>
        <button type="button" data-plan="c">C案（推奨）</button>
      </nav>
      <div class="viewports" aria-label="表示幅">
        <button type="button" class="active" data-view="desktop">PC表示</button>
        <button type="button" data-view="mobile">スマホ表示</button>
      </div>
    </div>
    <section class="summary" aria-live="polite">
      <div>
        <strong id="plan-title">A案｜目的から選ぶ</strong>
        <p id="plan-description">目的別の絞り込みから、該当コースを比較する構成です。</p>
      </div>
      <a id="open-link" class="open-link" href="a.html" target="_blank" rel="noopener">別タブで開く</a>
    </section>
    <div class="stage">
      <iframe id="preview" src="a.html" title="A案のモックアップ"></iframe>
    </div>
    <p class="notice">社内検討用のモックアップです。表示内容・料金は確定情報ではありません。</p>
  </main>
  <script>
    const plans = {
      a: { title: 'A案｜目的から選ぶ', description: '目的別の絞り込みから、該当コースを比較する構成です。' },
      b: { title: 'B案｜標準コースと特化コースから選ぶ', description: '留学の基本形を先に示し、必要な人を専門コースへ案内する構成です。' },
      c: { title: 'C案｜料金プランから比較する（推奨）', description: '料金を確認したい利用者の意図に合わせ、期間・費用の比較を入口にする構成です。' }
    };
    const preview = document.getElementById('preview');
    const openLink = document.getElementById('open-link');
    document.querySelectorAll('[data-plan]').forEach((button) => {
      button.addEventListener('click', () => {
        const key = button.dataset.plan;
        document.querySelectorAll('[data-plan]').forEach((item) => item.classList.toggle('active', item === button));
        document.getElementById('plan-title').textContent = plans[key].title;
        document.getElementById('plan-description').textContent = plans[key].description;
        preview.src = `${key}.html`;
        preview.title = `${button.textContent}のモックアップ`;
        openLink.href = `${key}.html`;
      });
    });
    document.querySelectorAll('[data-view]').forEach((button) => {
      button.addEventListener('click', () => {
        document.querySelectorAll('[data-view]').forEach((item) => item.classList.toggle('active', item === button));
        preview.classList.toggle('mobile', button.dataset.view === 'mobile');
      });
    });
  </script>
</body>
</html>
